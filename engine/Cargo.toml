[package]
name = "srtla-engine"
version = "0.1.9"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"

[lib]
name = "srtla_engine"
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["sync", "rt", "time"] }
srtla_send = { path = "../third_party/srtla_send" }

[dev-dependencies]
proptest = "1"
# Drive the real SRTLA scheduler (sans-IO) in the multi-link simulation.
srtla-core = { path = "../third_party/srtla_send/crates/srtla-core", features = ["test-internals"] }
srtla-protocol = { path = "../third_party/srtla_send/crates/srtla-protocol" }
smallvec = "=2.0.0-alpha.12"
