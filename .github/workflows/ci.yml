name: obs-srtla-output

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  OBS_VERSION: "32"
  RUST_VERSION: "1.88.0"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - name: Test engine
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Lint engine
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings
      - name: Test vendored sender
        run: cargo test --manifest-path third_party/srtla_send/Cargo.toml --workspace

  native-plugin:
    name: OBS 32 plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: windows
            arch: x86_64
            artifact: obs-srtla-output-windows-x64
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            artifact: obs-srtla-output-linux-x86_64
          - name: Linux arm64
            os: ubuntu-26.04-arm
            platform: linux
            arch: arm64
            artifact: obs-srtla-output-linux-arm64
          - name: macOS x86_64
            os: macos-15-intel
            platform: macos
            arch: x86_64
            artifact: obs-srtla-output-macos-x86_64
          - name: macOS arm64
            os: macos-15
            platform: macos
            arch: arm64
            artifact: obs-srtla-output-macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Provision OBS 32 development environment
        id: obs-deps
        if: matrix.platform != 'linux' || matrix.arch != 'arm64'
        uses: norihiro/obs-studio-devel-action@4d9bd843ff3f720432ccab26bf913f1435bc6618
        with:
          obs: ${{ env.OBS_VERSION }}
          qt: true
          arch: ${{ matrix.arch }}
      - name: Provision OBS 32 development environment (Linux arm64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libmbedtls-dev \
            libobs-dev \
            libsimde-dev \
            libswresample-dev \
            libswscale-dev \
            ninja-build \
            obs-studio \
            pkg-config \
            qt6-base-dev
          obs_version="$(dpkg-query -W -f='${Version}' obs-studio)"
          case "$obs_version" in
            32.*) ;;
            *)
              echo "Expected OBS 32 on the arm64 runner, found $obs_version" >&2
              exit 1
              ;;
          esac
      - name: Install mbedTLS development package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libmbedtls-dev \
            libswresample-dev \
            libswscale-dev
      - name: Configure Release build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-G', 'Visual Studio 17 2022',
            '-A', 'x64',
            '-DOBS_SRTLA_BUILD_TESTS=ON',
            '-DOBS_SRTLA_BUILD_VENDOR_SRT=ON',
            '-DOBS_SRTLA_REQUIRE_PLUGIN=ON'
          )
          $obsArgs = '${{ steps.obs-deps.outputs.PLUGIN_CMAKE_OPTIONS_PS }}'.Split(
            ' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          cmake @cmakeArgs @obsArgs
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Configure Release build (POSIX)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake_args=(
            -S .
            -B build
            -DOBS_SRTLA_BUILD_TESTS=ON
            -DOBS_SRTLA_BUILD_VENDOR_SRT=ON
            -DOBS_SRTLA_REQUIRE_PLUGIN=ON
          )
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            deployment_target='${{ steps.obs-deps.outputs.MACOSX_DEPLOYMENT_TARGET }}'
            if [[ -z "$deployment_target" ]]; then
              deployment_target=12.0
            fi
            cmake_args+=(
              -G Xcode
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$deployment_target"
            )
          else
            cmake_args+=(
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
            )
          fi
          cmake "${cmake_args[@]}" ${{ steps.obs-deps.outputs.PLUGIN_CMAKE_OPTIONS }}
      - name: Build Release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $plugin = Get-ChildItem build\plugin -Recurse -File -Filter 'obs-srtla-output.dll' |
            Select-Object -First 1
          if (!$plugin) { throw 'The build did not produce obs-srtla-output.dll' }
          Write-Host "Built $($plugin.FullName)"
      - name: Build Release (POSIX)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          build_config=Release
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            build_config=RelWithDebInfo
          fi
          cmake --build build --config "$build_config" --parallel
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            plugin_path="$(find build -name 'obs-srtla-output.plugin' -type d -print -quit)"
          else
            plugin_path="$(find build -name 'obs-srtla-output.so' -type f -print -quit)"
          fi
          test -n "$plugin_path"
      - name: Test Release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed' }
      - name: Test Release (POSIX)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          build_config=Release
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            build_config=RelWithDebInfo
          fi
          ctest --test-dir build -C "$build_config" --output-on-failure
      - name: Package Release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cpack -B package --config build\CPackConfig.cmake -C Release
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
          $archives = @(Get-ChildItem package -File -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected one release ZIP, found $($archives.Count)"
          }
          $contents = @(tar -tf $archives[0].FullName)
          if (-not ($contents | Where-Object { $_ -match '/obs-plugins/64bit/obs-srtla-output\.dll$' })) {
            throw 'The Windows package is missing the plugin DLL'
          }
          if (-not ($contents | Where-Object { $_ -match '/data/obs-plugins/obs-srtla-output/locale/en-US\.ini$' })) {
            throw 'The Windows package is missing locale data'
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $archives[0].FullName |
            Format-List
      - name: Package Release (POSIX)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          build_config=Release
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            build_config=RelWithDebInfo
          fi
          cpack -B package --config build/CPackConfig.cmake -C "$build_config"
          case '${{ matrix.platform }}' in
            macos)
              archive="$(find package -type f -name '*.zip' -print -quit)"
              test -n "$archive"
              unzip -l "$archive" | grep 'obs-srtla-output.plugin/Contents/Resources/locale/en-US.ini' > /dev/null
              ;;
            linux)
              archive="$(find package -type f -name '*.tar.gz' -print -quit)"
              test -n "$archive"
              tar -tzf "$archive" | grep '/obs-srtla-output.so$' > /dev/null
              tar -tzf "$archive" | grep '/obs-srtla-output/locale/en-US.ini$' > /dev/null
              ;;
          esac
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - rust
      - native-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches the project version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a plain semantic version, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          project_version="$(sed -nE 's/^project\(obs-srtla-output VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF_NAME" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi
      - name: Download all native packages
        uses: actions/download-artifact@v8
        with:
          pattern: obs-srtla-output-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          archives=(./*.zip ./*.tar.gz)
          if (( ${#archives[@]} != 5 )); then
            echo "Expected five native archives, found ${#archives[@]}" >&2
            exit 1
          fi
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "obs-srtla-output $GITHUB_REF_NAME"
          fi
